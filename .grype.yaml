---
# The action hardcodes severity-cutoff=high, fail-build=true and
# only-fixed=false, and the scan runs before the push — so without these rules
# nothing can ever publish. Rules are scoped by package type or location rather
# than by CVE so they do not go stale. deb and npm findings stay enforced,
# apart from the version-scoped rules below and a CVE the distro rules out.
ignore:
  # Go stdlib and vendored deps inside the prebuilt gh, glab and task binaries,
  # which only an upstream rebuild moves. Scoped to /usr/bin so it does NOT
  # cover the Go toolchain this repo pins itself at /usr/local/go — a stdlib
  # CVE there is fixable by bumping ARG GO_VERSION and stays enforced.
  - package:
      type: go-module
      location: /usr/bin/**
    reason: Vendored code inside prebuilt upstream binaries.

  # AWS CLI v2's bundled interpreter, distinct from the distro python3 deb.
  - package:
      name: python
      type: binary
    reason: AWS CLI v2's vendored interpreter; moves with pins/awscli.env.

  # GHSA-vfj7-8cjw-p6xm (stack-exhaustion DoS on deeply nested brace patterns)
  # covers every braces release; 3.0.3 is the latest and none is patched. It
  # reaches us only as openspec -> fast-glob -> micromatch -> braces, all three
  # already at their latest. openspec only globs a schema's `generates:` paths,
  # so the worst case is a repo crashing its own openspec run. Scoped to this
  # version and openspec's tree, so a patched release or any other copy of
  # braces stays enforced.
  - package:
      name: braces
      version: 3.0.3
      location: "**/node_modules/@fission-ai/openspec/**"
    reason: No patched braces exists; moves with pins/openspec.env.

  # CVE-2026-123158 is a password-auth bypass in sshd on musl libc without
  # PAM (e.g. Alpine). The image ships only openssh-client, on glibc, and
  # Ubuntu marks every resolute openssh "not-affected", so no package update
  # will clear it. Scoped to this CVE and openssh-client, not by version:
  # any other openssh-client finding stays enforced.
  - vulnerability: CVE-2026-123158
    package:
      name: openssh-client
      type: deb
    reason: sshd-on-musl only; Ubuntu resolute not-affected; image ships the client on glibc.

  # npm's own bundle (pins/npm.env). npm vendors its deps, so this clears only
  # with an npm release that carries the fix; npm 12.2.1 still ships undici
  # 6.29.0. Scoped to version and npm's tree, so an npm bump that moves it, or
  # any other copy, stays enforced. Mirrors the npm-tree half of the undici
  # .trivyignore entries (CVE-2026-109869, 109383, 87018).
  #
  # When a pin refresh moves a bundled version, this rule stops matching.
  # ci.yml's grype gate fails the PR on it, fixable or not, even though
  # .trivyignore, which matches by ID image-wide, still accepts the CVE. On an
  # npm bump, recheck the version below.
  - package:
      name: undici
      version: 6.29.0
      location: "**/node_modules/npm/**"
    reason: >-
      Bundled by npm 12.2.1 (pinned) at 6.29.0; no npm release carries
      6.29.1 yet. Moves with pins/npm.env.

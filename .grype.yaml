---
# The action hardcodes severity-cutoff=high, fail-build=true and
# only-fixed=false, and the scan runs before the push — so without these rules
# nothing can ever publish. Rules are scoped by package type or location rather
# than by CVE so they do not go stale. deb and npm findings stay enforced,
# apart from the version-scoped rules below.
ignore:
  # Go stdlib and vendored deps inside the prebuilt gh, glab and task binaries,
  # which only an upstream rebuild moves. Scoped to /usr/bin so it does NOT
  # cover the Go toolchain this repo pins itself at /usr/local/go — a stdlib
  # CVE there is fixable by bumping ARG GO_VERSION and stays enforced.
  - package:
      type: go-module
      location: /usr/bin/**
    reason: Vendored code inside prebuilt upstream binaries.

  # AWS CLI v2's bundled interpreter, distinct from the distro python3 deb.
  - package:
      name: python
      type: binary
    reason: AWS CLI v2's vendored interpreter; moves with pins/awscli.env.

  # az's cryptography, held at 48.x by azure-cli-core's exact msal==1.36.0 pin
  # (msal <1.39 caps cryptography <49); only a core release moves it. Scoped to
  # this version and /opt/az, so a newer resolution or any other copy of
  # cryptography stays enforced. Mirrors the two .trivyignore entries.
  - package:
      name: cryptography
      version: 48.0.1
      location: /opt/az/**
    reason: Held by azure-cli-core's msal pin; moves with pins/az.env.
  # The same pin as the action's second scan (the repo checkout) sees it: the
  # hash-locked requirements file the Dockerfile installs /opt/az from.
  - package:
      name: cryptography
      version: 48.0.1
      location: "**/pins/az-requirements.txt"
    reason: Held by azure-cli-core's msal pin; moves with pins/az.env.

  # GHSA-vfj7-8cjw-p6xm (stack-exhaustion DoS on deeply nested brace patterns)
  # covers every braces release; 3.0.3 is the latest and none is patched. It
  # reaches us only as openspec -> fast-glob -> micromatch -> braces, all three
  # already at their latest. openspec only globs a schema's `generates:` paths,
  # so the worst case is a repo crashing its own openspec run. Scoped to this
  # version and openspec's tree, so a patched release or any other copy of
  # braces stays enforced.
  - package:
      name: braces
      version: 3.0.3
      location: "**/node_modules/@fission-ai/openspec/**"
    reason: No patched braces exists; moves with pins/openspec.env.

  # npm's own bundle (pins/npm.env). npm vendors its deps, so these clear only
  # with an npm release that carries the fix; npm 11.21.0 and 12.2.0 still ship
  # the versions below. Scoped to version and npm's tree, so an npm bump that
  # moves them, or any other copy, stays enforced. undici and brace-expansion
  # mirror the three .trivyignore entries. http-cache-semantics has no patched
  # release per its advisory (GHSA-ch52-4w7c-c8xp), so trivy doesn't gate it,
  # but grype's only-fixed=false does.
  - package:
      name: undici
      version: 6.28.0
      location: "**/node_modules/npm/**"
    reason: Bundled by npm; no npm release carries 6.28.1 yet. Moves with pins/npm.env.
  - package:
      name: brace-expansion
      version: 5.0.9
      location: "**/node_modules/npm/**"
    reason: Bundled by npm; no npm release carries 5.0.10+ yet. Moves with pins/npm.env.
  - package:
      name: http-cache-semantics
      version: 4.2.0
      location: "**/node_modules/npm/**"
    reason: Bundled by npm; the advisory lists no patched version. Moves with pins/npm.env.

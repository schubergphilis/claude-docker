<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="715" viewBox="0 0 1160 715" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>claude-docker architecture</title>
  <desc>You give a task to Claude Code, which runs in the claude-docker container on your machine with your mounted workspace and opt-in config. It talks to one model backend (a gateway such as LiteLLM via --api, or the Anthropic API directly) and to your Git forge (Azure DevOps via --az, GitLab via --glab, GitHub via --gh). The container sees only the directories you pass in, gets host credentials only with an opt-in flag, and is removed when the session ends.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5361"/>
    </marker>
    <g id="asterisk" stroke="#d97757" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-18" x2="0" y2="18"/>
      <line x1="-18" y1="0" x2="18" y2="0"/>
      <line x1="-13" y1="-13" x2="13" y2="13"/>
      <line x1="-13" y1="13" x2="13" y2="-13"/>
    </g>
    <g id="check">
      <circle r="8" fill="#2e9a5b"/>
      <path d="M-4,0 L-1,3 L4,-3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1160" height="715" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="55" font-size="34" font-weight="700" fill="#111">claude-docker<tspan font-size="24" font-weight="400" fill="#5a6270">: the harness that runs Claude Code in a container</tspan></text>
  <text x="20" y="92" font-size="17" fill="#5a6270">Pick your model backend and connect your Git forge. The container narrows what the agent can reach on your machine.</text>

  <!-- Your machine -->
  <rect x="20" y="130" width="590" height="565" rx="16" fill="#f6f7f9" stroke="#d5d9df" stroke-width="2"/>
  <text x="40" y="165" font-size="14" font-weight="700" letter-spacing="2" fill="#5a6270">YOUR MACHINE</text>

  <!-- You -->
  <circle cx="80" cy="262" r="38" fill="#fff" stroke="#c9ced6" stroke-width="2"/>
  <circle cx="80" cy="250" r="12" fill="#4a5361"/>
  <path d="M58,284 C58,266 102,266 102,284 Z" fill="#4a5361"/>
  <text x="80" y="322" font-size="17" font-weight="700" fill="#111" text-anchor="middle">You</text>
  <text x="80" y="342" font-size="13" fill="#5a6270" text-anchor="middle">prompt / task</text>
  <line x1="122" y1="262" x2="172" y2="262" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Container -->
  <rect x="180" y="180" width="410" height="495" rx="14" fill="#eef3fc" stroke="#3b6fd8" stroke-width="3"/>
  <text x="200" y="218" font-size="22" font-weight="700" fill="#1f3f8f">claude-docker container</text>
  <text x="200" y="242" font-size="14" fill="#3b6fd8">the harness: narrows the agent's reach on your host</text>

  <!-- Claude Code -->
  <rect x="200" y="262" width="370" height="122" rx="10" fill="#fff" stroke="#d97757" stroke-width="2.5"/>
  <use href="#asterisk" x="238" y="323"/>
  <text x="272" y="305" font-size="19" font-weight="700" fill="#111">Claude Code (agent)</text>
  <text x="272" y="331" font-size="14" fill="#333">reads code, edits files, runs tools,</text>
  <text x="272" y="351" font-size="14" fill="#333">opens issues and pull/merge requests</text>

  <!-- Workspace -->
  <rect x="200" y="400" width="178" height="100" rx="10" fill="#fff" stroke="#c9ced6" stroke-width="1.5"/>
  <path d="M214,428 h14 l5,6 h21 v24 h-40 z" fill="#f2c14e" stroke="#c99a22" stroke-width="1.5"/>
  <text x="264" y="434" font-size="15" font-weight="700" fill="#111">Workspace</text>
  <text x="264" y="455" font-size="12" fill="#5a6270">the directories</text>
  <text x="264" y="471" font-size="12" fill="#5a6270">you pass in,</text>
  <text x="264" y="487" font-size="12" fill="#5a6270">mounted</text>

  <!-- Config -->
  <rect x="392" y="400" width="178" height="100" rx="10" fill="#fff" stroke="#c9ced6" stroke-width="1.5"/>
  <circle cx="420" cy="440" r="11" fill="none" stroke="#4a5361" stroke-width="3"/>
  <circle cx="420" cy="440" r="4" fill="#4a5361"/>
  <text x="442" y="434" font-size="15" font-weight="700" fill="#111">Config</text>
  <text x="442" y="455" font-size="12" fill="#5a6270">model endpoint,</text>
  <text x="442" y="471" font-size="12" fill="#5a6270">forge tokens</text>
  <text x="442" y="487" font-size="12" fill="#5a6270">(opt-in per flag)</text>

  <!-- Isolation -->
  <rect x="200" y="516" width="370" height="139" rx="10" fill="#fff" stroke="#3b6fd8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="218" y="545" font-size="16" font-weight="700" fill="#1f3f8f">What the container limits</text>
  <use href="#check" x="228" y="572"/>
  <text x="246" y="577" font-size="14" fill="#333">sees only the directories you pass in</text>
  <use href="#check" x="228" y="600"/>
  <text x="246" y="605" font-size="14" fill="#333">host credentials only with an opt-in flag</text>
  <use href="#check" x="228" y="628"/>
  <text x="246" y="633" font-size="14" fill="#333">container removed when the session ends</text>

  <!-- Model backend -->
  <text x="680" y="160" font-size="14" font-weight="700" letter-spacing="2" fill="#5a6270">MODEL BACKEND: CHOOSE ONE</text>
  <rect x="680" y="178" width="210" height="132" rx="12" fill="#fff" stroke="#4aa3df" stroke-width="2.5"/>
  <text x="698" y="210" font-size="17" font-weight="700" fill="#111">LiteLLM / gateway</text>
  <text x="698" y="236" font-size="12.5" fill="#333">via --api: keys, budgets,</text>
  <text x="698" y="255" font-size="12.5" fill="#333">logging, routing to Bedrock,</text>
  <text x="698" y="274" font-size="12.5" fill="#333">Vertex, Azure or Anthropic</text>
  <text x="910" y="250" font-size="17" font-weight="700" fill="#8a919c" text-anchor="middle">or</text>
  <rect x="930" y="178" width="210" height="132" rx="12" fill="#fff" stroke="#d97757" stroke-width="2.5"/>
  <g transform="translate(958 204) scale(0.55)"><use href="#asterisk"/></g>
  <text x="980" y="210" font-size="17" font-weight="700" fill="#111">Claude</text>
  <text x="946" y="236" font-size="12.5" fill="#333">directly via the Anthropic API</text>
  <text x="946" y="255" font-size="12.5" fill="#333">(api.anthropic.com), with</text>
  <text x="946" y="274" font-size="12.5" fill="#333">your Claude login or API key</text>

  <!-- Model traffic -->
  <path d="M570,300 C620,300 640,244 676,244" fill="none" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M570,340 C760,345 940,345 1035,314" fill="none" stroke="#4a5361" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="645" y="196" font-size="11" fill="#5a6270" text-anchor="middle">prompts /</text>
  <text x="645" y="210" font-size="11" fill="#5a6270" text-anchor="middle">completions</text>

  <!-- Git forges -->
  <text x="680" y="380" font-size="14" font-weight="700" letter-spacing="2" fill="#5a6270">GIT FORGE: WORKS WITH</text>
  <rect x="680" y="395" width="460" height="82" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="2.5"/>
  <rect x="680" y="395" width="10" height="82" rx="4" fill="#2f6fd6"/>
  <text x="708" y="424" font-size="18" font-weight="700" fill="#111">Azure DevOps</text>
  <text x="708" y="446" font-size="13" fill="#333">Services or on-prem Server, via --az</text>
  <text x="708" y="464" font-size="13" fill="#5a6270">repos, pull requests, work items</text>

  <rect x="680" y="489" width="460" height="82" rx="12" fill="#fff" stroke="#e2692d" stroke-width="2.5"/>
  <rect x="680" y="489" width="10" height="82" rx="4" fill="#e2692d"/>
  <text x="708" y="518" font-size="18" font-weight="700" fill="#111">GitLab</text>
  <text x="708" y="540" font-size="13" fill="#333">gitlab.com or self-managed, via --glab</text>
  <text x="708" y="558" font-size="13" fill="#5a6270">merge requests, issues</text>

  <rect x="680" y="583" width="460" height="82" rx="12" fill="#fff" stroke="#24292f" stroke-width="2.5"/>
  <rect x="680" y="583" width="10" height="82" rx="4" fill="#24292f"/>
  <text x="708" y="612" font-size="18" font-weight="700" fill="#111">GitHub</text>
  <text x="708" y="634" font-size="13" fill="#333">github.com via --gh; Enterprise Server via --gh-direct</text>
  <text x="708" y="652" font-size="13" fill="#5a6270">pull requests, issues</text>

  <!-- Forge traffic -->
  <path d="M570,450 C625,450 630,530 674,530" fill="none" stroke="#4a5361" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="645" y="588" font-size="11" fill="#5a6270" text-anchor="middle">clone, push,</text>
  <text x="645" y="602" font-size="11" fill="#5a6270" text-anchor="middle">PRs, MRs,</text>
  <text x="645" y="616" font-size="11" fill="#5a6270" text-anchor="middle">issues</text>
</svg>

# yamllint disable rule:line-length
---
name: Release
# Keeps one draft GitHub Release up to date with the next version and its
# notes, counted from the Conventional Commit PR titles merged since the last
# published release (.github/actions/draft-release). Nothing is published
# here: a maintainer publishes the draft when a release is wanted, see
# docs/maintenance.md#releasing.
#
# Publishing creates the version tag under the maintainer's account, and a tag
# pushed by a person starts workflows, so docker.yml's `tags: [v*]` trigger
# builds, scans and publishes the image without a dispatch from here.
"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render the notes in the job summary without touching the draft release
        type: boolean
        default: false
# Two pushes landing together would otherwise both edit the same draft. The
# action drafts the branch tip, so the run that survives draws the right one.
concurrency:
  cancel-in-progress: true
  group: release
permissions:
  contents: read
jobs:
  draft:
    name: Draft the next release
    permissions:
      contents: write  # create and update the draft release
      pull-requests: read  # read the titles the notes are made of
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Draft the release
        uses: $/.github/actions/draft-release
        with:
          # `inputs` is empty on a push, so the dispatch default does not apply there.
          dry_run: ${{ inputs.dry_run || 'false' }}

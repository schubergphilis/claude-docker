---
name: General
"on":
  pull_request:
permissions:
  contents: read
  packages: read
jobs:
  MCVS-general-action:
    strategy:
      matrix:
        args:
          - testing-type: lint-action
          - testing-type: lint-commit
          - testing-type: yamllint
          # Blocking: README's reference material lives in docs/, so a link now
          # breaks on a heading rename in a file the author wasn't looking at.
          # Offline via lychee.toml, so only local paths and #fragments.
          - testing-type: lint-links
          # markdownlint-cli2 over **/*.md with the action's config (MD013
          # off, <img> allowed). openspec/specs/ (generated) and
          # openspec/changes/archive/ (history) opt out through their own
          # .markdownlint.yaml. The PR template disables MD041 for its first
          # heading only, inline.
          - testing-type: markdownlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The previous ref was the zizmor-advanced-security feature branch, which
      # has since been merged and deleted, so every run failed to resolve the
      # action. Pinned by commit SHA rather than by tag name: this
      # job's own zizmor audit reports a tag ref as unpinned-uses, and a tag is
      # mutable. Same style as the actions/checkout pin above.
      # yamllint disable rule:line-length
      - uses: schubergphilis/mcvs-general-action@96298a5c109d08a0dfd9047963e01e2441421a3f # v0.11.1
        with:
          testing-type: ${{ matrix.args.testing-type }}

# yamllint disable rule:line-length
---
name: Homebrew

# This repository is its own Homebrew tap, and Formula/claude-docker.rb names
# the latest stable release. A release cannot name its own archive's checksum,
# so after each one this opens a pull request that moves the formula to it.
# docker.yml calls this once a tag's image is published, so the formula never
# points at an image that was not: a tag whose scan fails publishes nothing
# and gets no pull request.
#
# A reusable workflow called from docker.yml rather than a `workflow_run` on
# it: same ordering, without a trigger that runs with write access on another
# workflow's behalf.
#
# The dispatch is the fallback for a tag whose bump did not happen; re-running
# docker.yml cannot do it, since it refuses a tag that is already published.
"on":
  workflow_call:
    inputs:
      tag:
        description: Release tag to move the formula to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to move the formula to, e.g. v1.2.3
        required: true

permissions:
  contents: read

concurrency:
  # Two bumps at once would race on main's formula. Never cancel one in
  # flight; it may be mid-push.
  group: homebrew
  cancel-in-progress: false

jobs:
  bump:
    name: Bump the Homebrew formula
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Release candidates are published to ghcr on purpose but are not
      # supported, so they never reach Homebrew. Only a stable tag whose image
      # is published goes on, and a dispatch is held to the same rule.
      - name: Check the tag is a published stable release
        id: tag
        env:
          TAG: ${{ inputs.tag }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "${TAG} is not a stable vX.Y.Z tag, so it does not go to Homebrew." >> "$GITHUB_STEP_SUMMARY"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! docker buildx imagetools inspect "${IMAGE,,}:${TAG}" >/dev/null; then
            echo "::error title=Image not published::${IMAGE,,}:${TAG} is not published, so the formula would point at an image that does not exist. Publish it first: gh workflow run docker.yml --ref ${TAG}"
            exit 1
          fi
          echo "stable=true" >> "$GITHUB_OUTPUT"

      # main, not the tag: the formula is read from the tap's default branch.
      - if: steps.tag.outputs.stable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # No persisted credentials: only the push below needs write access,
          # and it authenticates explicitly.
          persist-credentials: false

      - name: Open the pull request
        if: steps.tag.outputs.stable == 'true'
        env:
          TAG: ${{ inputs.tag }}
          # A pull request opened with GITHUB_TOKEN holds its checks until a
          # maintainer approves the run, as pins-updater.yml's does.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          formula=Formula/claude-docker.rb
          version="${TAG#v}"

          # Prints the version the formula named, or nothing when the
          # formula is already at this tag or a newer one.
          current="$(scripts/bump-homebrew-formula.sh "${TAG}")"
          if [[ -z "${current}" ]]; then
            exit 0
          fi

          # chore: auto-release cuts a version only for feat, fix and perf,
          # so merging the bump does not release again.
          title="chore(homebrew): claude-docker ${version}"
          branch="homebrew/${TAG}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "${branch}"
          git commit -m "${title}" -m "Automated by .github/workflows/homebrew.yml after ${TAG}'s image was published." -- "${formula}"
          # The token goes in a header passed through git's environment, the
          # way actions/checkout does it, so it is in neither the remote URL
          # nor the command line.
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git push --force "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"

          body="Moves the Homebrew formula to ${TAG}, whose image \`ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}\` is published. Until this merges, \`brew upgrade claude-docker\` stays on ${current}."
          number="$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${number}" ]]; then
            gh pr edit "${number}" --title "${title}" --body "${body}"
          else
            gh pr create --base main --head "${branch}" --title "${title}" --body "${body}"
          fi

          # Every bump rewrites the same two lines, so a bump for an older tag
          # still open would conflict with this one once it merges, and
          # resolving that the wrong way would move Homebrew users back.
          # Close them. Same-repository branches only: a fork's PR is not ours
          # to close.
          open="$(gh pr list --state open --limit 100 --json number,headRefName,isCrossRepository \
            --jq '.[] | select((.isCrossRepository | not) and (.headRefName | startswith("homebrew/v"))) | "\(.number) \(.headRefName)"')"
          while read -r other head; do
            [[ -n "${other}" && "${head}" != "${branch}" ]] || continue
            theirs="${head#homebrew/v}"
            if [[ "$(printf '%s\n' "${theirs}" "${version}" | sort -V | tail -n1)" == "${version}" ]]; then
              gh pr close "${other}" --delete-branch --comment "Superseded by the bump to ${TAG}."
            fi
          done <<< "${open}"

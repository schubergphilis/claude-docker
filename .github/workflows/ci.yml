# yamllint disable rule:line-length
---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR builds, but never cancel a run on main —
  # main runs validate merged code and must complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: .
          version: v0.11.0

      - name: Unit tests — update_pins.py helpers
        # stdlib unittest on the runner's preinstalled python3 — no install,
        # no third-party action (the suite imports only the standard library).
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: npm-pinned tools supply-chain audit
        # For EVERY npm-pinned tool enforce two policies: (1) tarball signed by
        # npm's keyring over dist.integrity (`npm audit signatures`), (2) soak
        # since publish (default 7 days) so loud supply-chain attacks get yanked
        # before we ingest.  The soak gate is enforced by update_pins.py --audit,
        # which is the single source of truth for soak logic (including the window
        # default).
        # The tool list is provided by update_pins.py --list-npm-tools so CI never
        # re-implements generator logic.
        run: |
          set -euo pipefail
          python3 update_pins.py --audit
          # Capture the tool list into a variable BEFORE looping: a process
          # substitution `done < <(cmd)` does NOT propagate cmd's non-zero exit
          # under `set -e`, so a fail-closed --list-npm-tools (e.g. a missing pin)
          # would silently yield an empty loop and skip every signature check
          # (fail-open). `$(...)` assignment, by contrast, DOES abort the step
          # under `set -e`, so the here-string consumer below is fail-closed.
          tools=$(python3 update_pins.py --list-npm-tools)
          while IFS=$'\t' read -r name pkg env var ver; do
            [ -n "$ver" ] || { echo "::error::no pinned version for $name"; exit 1; }
            scratch=$(mktemp -d)
            ( cd "$scratch" && npm init -y >/dev/null \
              && npm install --ignore-scripts --no-audit --no-fund --silent "${pkg}@${ver}" \
              && npm audit signatures )
          done <<< "$tools"

      - name: Markdown lint (advisory)
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        continue-on-error: true
        with:
          globs: "**/*.md"

      - name: Broken relative links (advisory, offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        continue-on-error: true
        with:
          args: --offline --include-fragments --no-progress .

  docker-build:
    name: Docker build (validate, no push)
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build (amd64, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Load into the local daemon so the smoke test below can run the
          # image. Build is amd64-only (single-arch load is fine); arm64
          # coverage relies on the maintainers' local builds for now.
          load: true
          tags: claude-docker:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Smoke test — every pinned CLI reports its pinned version
        # A successful install says nothing about whether the executable runs:
        # claude-code 2.1.x can install cleanly and leave `claude` a stub that
        # errors at exec time (see Dockerfile). Nothing else in CI invokes a
        # pinned tool, so without this a pin bump can ship a broken or
        # version-mismatched CLI on green.
        # The tool set, each tool's version probe, and the rule for reading a
        # version out of that probe all come from update_pins.py's registry, so
        # a newly pinned tool is covered without editing this file.
        # This step must live in docker-build: it is the only job whose local
        # daemon holds the image the build step loaded.
        run: |
          set -euo pipefail
          # Capture before looping. --list-tools is fail-closed, and `$(...)`
          # propagates its non-zero exit under `set -e` where a
          # `done < <(cmd)` process substitution would not.
          tools=$(python3 update_pins.py --list-tools)
          fail=0
          while IFS=$'\t' read -r name probe version_re pinned; do
            read -ra argv <<< "$probe"
            # One conditional chain, not three statements: an unrunnable tool,
            # an unreadable version and a wrong version must each land in the
            # `else` instead of tripping `set -e` and skipping the tools after
            # it. $version_re is deliberately unquoted — quoting the right-hand
            # side of =~ makes bash match it as a literal string, not a regex.
            # </dev/null keeps docker away from the loop's here-string.
            if actual=$(docker run --rm claude-docker:ci "${argv[@]}" </dev/null) \
               && [[ "$actual" =~ $version_re ]] \
               && [ "${BASH_REMATCH[1]}" = "$pinned" ]; then
              status=PASS
            else
              status=FAIL
              fail=1
            fi
            echo "  ${status}  ${name}  pinned=${pinned}  reported=${actual:-<probe failed>}"
            [ "$status" = PASS ] \
              || echo "::error::${name}: pinned ${pinned}, image reported '${actual:-<probe failed>}'"
          done <<< "$tools"
          exit "$fail"

      - name: Cross-platform smoke (Linux)
        # Drives smoke.sh across a matrix of cells, all reusing the already-loaded
        # claude-docker:ci image from the build step above.  Do NOT move this to a
        # separate job — a separate job gets a blank local daemon and cannot reuse
        # the image loaded by the build step.
        #
        # Cell inventory:
        #   1. runner-uid/cold/no-optins     — baseline privilege-drop to runner UID
        #   2. runner-uid/cold/aws           — AWS credential opt-in
        #   3. runner-uid/cold/glab          — GitLab credential opt-in
        #   4. runner-uid/cold/aws+glab+tfe  — all three opt-ins combined
        #   5. runner-uid/warm               — warm volume (HOST_UID-owned /root traversal)
        #   6. uid-501/cold/no-optins        — macOS-style UID (<1000, below Ubuntu floor)
        #   7. uid-0/cold/no-optins          — root-legacy path (HOST_UID=0 → exec directly)
        #   8. runner-uid/ephemeral          — --ephemeral mode (no named volumes)
        #   9. runner-uid/ro/no-optins       — read-only workspace (EROFS robustness)
        run: |
          set -euo pipefail
          export IMAGE=claude-docker:ci
          RUNNER_UID=$(id -u)

          run_cell() {
            echo "--- Cell: $* ---"
            IMAGE=claude-docker:ci bash smoke/smoke.sh "$@"
          }

          # 1. Baseline: runner UID, cold volume, no opt-ins.
          run_cell --uid="${RUNNER_UID}" --volstate=cold --ephemeral=0

          # 2. AWS opt-in.
          run_cell --uid="${RUNNER_UID}" --optins=aws --volstate=cold --ephemeral=0

          # 3. GitLab opt-in.
          run_cell --uid="${RUNNER_UID}" --optins=glab --volstate=cold --ephemeral=0

          # 4. All three opt-ins combined.
          run_cell --uid="${RUNNER_UID}" --optins=aws,glab,tfe --volstate=cold --ephemeral=0

          # 5. Warm volume: first run populates the named volume, second run
          #    traverses the now HOST_UID-owned 0700 /root (exercises CAP_DAC_READ_SEARCH).
          run_cell --uid="${RUNNER_UID}" --volstate=warm --ephemeral=0

          # 6. macOS-style UID 501 (below Ubuntu's default UID_MIN=1000).
          run_cell --uid=501 --volstate=cold --ephemeral=0

          # 7. Root-legacy path: HOST_UID=0 → entrypoint skips useradd+runuser and
          #    exec's claude directly as container root.
          run_cell --uid=0 --volstate=cold --ephemeral=0

          # 8. Ephemeral mode: no named volumes.
          run_cell --uid="${RUNNER_UID}" --ephemeral=1

          # 9. Read-only workspace: EROFS robustness — chown on :ro mounts must not
          #    abort the entrypoint; assert no spurious WARN on stderr.
          run_cell --uid="${RUNNER_UID}" --volstate=cold --ro=1 --ephemeral=0

          # 10. Non-runner GID: exercises the entrypoint's `useradd -g $HOST_GID`
          #     path with a GID that differs from the runner's (asserts the
          #     dropped process lands in exactly that primary group).
          run_cell --uid=501 --gid=501 --volstate=cold --ephemeral=0

      # Known-CVE scanning of the image, in two passes over the same artifact.
      # Like the steps above, these must live in docker-build: Trivy resolves an
      # unqualified reference against the local daemon first, and this is the
      # only job whose daemon holds the image the build step loaded. Putting
      # them in a job of their own would also mean gating nothing — main's
      # ruleset requires the `Validate` and `Docker build (validate, no push)`
      # contexts, so a third context blocks no merge until an operator adds it.
      #
      # Consequence worth knowing when this job goes red: a failure here is a
      # CVE, not a broken build. The step names say which.
      #
      # `scanners: vuln` is explicit on both passes and must stay that way. An
      # unset input exports no TRIVY_SCANNERS, so Trivy's own default of
      # `vuln,secret` applies and secret detection runs over the whole image
      # filesystem — where the Go distribution's crypto test data and vendored
      # node_modules fixtures carry dummy keys. A secret finding has no fixed
      # version, so `ignore-unfixed` cannot filter it, and it would block every
      # merge under a check that is meant to be about vulnerabilities.
      #
      # `vuln-type` is deliberately left at the action's `os,library` default:
      # that default is the OS-plus-language coverage we want, and the npm
      # supply-chain audit in `validate` proves tarball provenance, not that the
      # code inside a pinned CLI is free of disclosed CVEs.
      - name: Vulnerability scan — HIGH/CRITICAL, advisory (includes unfixed)
        # Runs first so the full picture is already in the log when the gate
        # below fails. `exit-code: 0` rather than continue-on-error: Trivy has
        # its own exit-code control, and continue-on-error would decorate the
        # step with a failure annotation while it is doing exactly its job.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          scan-ref: claude-docker:ci
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: 0
          # Passed explicitly on both passes, not left to Trivy's auto-detection:
          # the action errors when the named file is missing, so deleting or
          # renaming it fails the build instead of silently scanning with no
          # suppressions, and it cats the file into the log so a suppression is
          # visible to anyone reading a scan. On this pass too, so a suppressed
          # finding does not reappear here and read as unsuppressed.
          trivyignores: .trivyignore

      - name: Vulnerability scan — HIGH/CRITICAL with a fix available (gate)
        # Identical to the advisory pass except for ignore-unfixed and
        # exit-code, so the two cannot disagree about severity or suppressions.
        # Only fixable findings gate: an unfixed upstream CVE cannot be actioned
        # by whoever opens the next unrelated PR, and blocking on one would hold
        # a required check red for every contributor until somebody silenced it.
        # Accept a finding in .trivyignore (reason + expiry required); do not
        # weaken severity or exit-code here.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          scan-ref: claude-docker:ci
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore

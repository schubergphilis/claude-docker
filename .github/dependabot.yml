---
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-all:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-all:
        patterns:
          - "*"
    ignore:
      # Pinned to the commit docker.yml's mcvs-docker-action runs, so the PR and
      # publish scans run one grype. It moves with that pin, not on its own:
      # see tests/test_grype_gate.py.
      - dependency-name: anchore/scan-action
